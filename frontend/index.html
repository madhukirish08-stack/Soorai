<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Belt RUL — Belt Health & Remaining Life</title>
  <meta name="description" content="Remaining-useful-life prediction and health tracking for industrial power-transmission belts." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ═══════════ LOGIN ═══════════ -->
  <div id="login-view" class="login-wrap hidden">
    <form id="login-form" class="card login-card" autocomplete="on">
      <div class="logo login-logo">
        <span class="logo-icon">⚙</span>
        <div>
          <div class="logo-name">Belt<span class="logo-accent">RUL</span></div>
          <div class="logo-sub">Belt Health &amp; Remaining Life</div>
        </div>
      </div>
      <div class="form-group">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required />
      </div>
      <div id="login-error" class="notice notice-error hidden"></div>
      <button type="submit" class="btn btn-primary btn-large btn-block">Sign in</button>
    </form>
  </div>

  <!-- ═══════════ APP ═══════════ -->
  <div id="app-view" class="hidden">
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <span class="logo-icon">⚙</span>
          <div>
            <div class="logo-name">Belt<span class="logo-accent">RUL</span></div>
            <div class="logo-sub">Belt Health &amp; Remaining Life</div>
          </div>
        </div>
        <nav class="main-nav" id="main-nav"></nav>
        <div class="user-box">
          <span class="user-name" id="user-name"></span>
          <span class="role-chip" id="user-role"></span>
          <span class="help-wrap">
            <button class="btn btn-ghost btn-sm" data-action="help" aria-haspopup="true">? Help</button>
            <div class="help-menu hidden" id="help-menu">
              <button class="help-item" data-action="tour-page">Tour of this page</button>
              <button class="help-item" data-action="tour-welcome">Welcome tour</button>
            </div>
          </span>
          <button class="btn btn-ghost btn-sm" data-action="logout">Sign out</button>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="view hidden" id="view-fleet"></section>
      <section class="view hidden" id="view-belt"></section>
      <section class="view hidden" id="view-types"></section>
      <section class="view hidden" id="view-data"></section>
      <section class="view hidden" id="view-models"></section>
      <section class="view hidden" id="view-users"></section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="overlay" class="overlay hidden">
    <div class="overlay-box">
      <div class="spinner"></div>
      <div class="overlay-text" id="overlay-text">Working…</div>
      <div class="overlay-sub" id="overlay-sub"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="tour.js"></script>
  <script src="app.js"></script>
</body>
</html>
